services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: local_ticketing
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ticketing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Ticketing: "Host=db;Database=ticketing;Username=ticketing;Password=local_ticketing"
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:5080:8080"
volumes:
  ticketing-data:
